name: Publish ValuePlus Update

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-windows-update:
    name: Build and publish Windows updater
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.13.1"
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign and publish update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Geniussalt001
          repo: valueplus-system-releases
          releaseCommitish: main
          tagName: v__VERSION__
          releaseName: "ValuePlus System v__VERSION__"
          releaseBody: |
            ValuePlus System automatic update.

            กด "ตรวจสอบอัปเดต" ภายในโปรแกรมเพื่อดาวน์โหลดและติดตั้งเวอร์ชันนี้
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          tauriScript: pnpm tauri
          args: "--bundles nsis"
          retryAttempts: 2
