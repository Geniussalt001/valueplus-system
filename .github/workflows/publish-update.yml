name: Publish ValuePlus Update

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-windows-update:
    name: Build and publish Windows updater
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.13.1"
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled ValuePlus Engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt pyinstaller
          New-Item -ItemType Directory -Path src-tauri/binaries -Force | Out-Null
          New-Item -ItemType Directory -Path build/valueplus-engine -Force | Out-Null
          New-Item -ItemType Directory -Path build/valueplus-engine-spec -Force | Out-Null
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name valueplus-engine `
            --distpath src-tauri/binaries `
            --workpath build/valueplus-engine `
            --specpath build/valueplus-engine-spec `
            --paths python `
            --hidden-import pythoncom `
            --hidden-import pywintypes `
            --hidden-import win32timezone `
            --hidden-import win32com.client `
            python/valueplus_engine.py

          $source = "src-tauri/binaries/valueplus-engine.exe"
          $target = "src-tauri/binaries/valueplus-engine-x86_64-pc-windows-msvc.exe"

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "PyInstaller did not create $source"
          }

          Move-Item -LiteralPath $source -Destination $target -Force

          & $target product-catalog --help

          if ($LASTEXITCODE -ne 0) {
            throw "Bundled ValuePlus Engine self-test failed"
          }

      - name: Build, sign and publish update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Geniussalt001
          repo: valueplus-system-releases
          releaseCommitish: main
          tagName: v__VERSION__
          releaseName: "ValuePlus System v__VERSION__"
          releaseBody: |
            ValuePlus System automatic update.

            กด "ตรวจสอบอัปเดต" ภายในโปรแกรมเพื่อดาวน์โหลดและติดตั้งเวอร์ชันนี้
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          tauriScript: pnpm tauri
          args: "--bundles nsis"
          retryAttempts: 2
